name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, Monday 06:17 UTC. Offset from the top of the hour.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check JSON files parse
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          failed = False
          for path in sorted(pathlib.Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  print(f"{path}: {exc}", file=sys.stderr)
                  failed = True
              else:
                  print(f"parsed {path}")
          if failed:
              sys.exit(1)
          PY

      - name: Validate server.json against the MCP registry schema
        run: |
          set -euo pipefail
          schema="$(python3 -c 'import json; print(json.load(open("server.json"))["$schema"])')"
          case "$schema" in
            https://static.modelcontextprotocol.io/schemas/*/server.schema.json) ;;
            *)
              echo "server.json \$schema is not an MCP registry server schema: $schema" >&2
              exit 1
              ;;
          esac
          python3 -m venv "${RUNNER_TEMP}/jsonschema"
          "${RUNNER_TEMP}/jsonschema/bin/pip" install --disable-pip-version-check 'check-jsonschema==0.39.0'
          "${RUNNER_TEMP}/jsonschema/bin/check-jsonschema" --schemafile "$schema" server.json

      # Hosted MCP endpoints need credentials and answer 405 to a plain GET.
      # Leave them out so the link check stays on documentation URLs.
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --max-concurrency 4
            --exclude '^https://api\.[^/]*\.coralogix\.com/'
            './**/*.md'
